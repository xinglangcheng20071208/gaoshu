<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>高数刷题营 · 大一上学期</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">
<header class="topbar">
  <div class="brand">
    <span class="logo">∫</span>
    <div class="brand-txt">
      <div class="brand-name">高数刷题营</div>
      <div class="brand-sub">大一上学期 · 每天 10 题 · 智能复习</div>
    </div>
  </div>
  <button id="themeBtn" class="icon-btn" title="切换深色/浅色模式">🌙</button>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="app"></main>

<footer class="foot">
  <button id="resetBtn" class="foot-btn">重置全部数据</button>
  <span class="foot-note">数据仅保存在本机浏览器 · 覆盖大一上学期：极限/导数/中值定理/不定积分/定积分及其应用/微分方程</span>
</footer>

<script src="js/katex-fallback.js"></script>
<script src="js/core.js"></script>
<script src="js/qb-limit.js"></script>
<script src="js/qb-derivative.js"></script>
<script src="js/qb-app.js"></script>
<script src="js/qb-integral.js"></script>
<script src="js/qb-extra.js"></script>
<script src="js/qb-more.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.__initApp) window.__initApp();
});
window.addEventListener('load', function () {
  if (window.__rerenderAll) window.__rerenderAll();
});
</script>
</body>
</html>
