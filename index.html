<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>刷题营 · 高数 &amp; 北京高考</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">
<header class="topbar">
  <div class="brand">
    <span class="logo">∫</span>
    <div class="brand-txt">
      <div class="brand-name">高数刷题营</div>
      <div class="brand-sub">高数 · 北京高考 · 每天 10 题 · 智能复习</div>
    </div>
  </div>
  <div class="track-seg" id="trackSeg"><button data-track="gaoshu" class="on">高数</button><button data-track="gaokao">北京高考</button></div>
  <button id="themeBtn" class="icon-btn" title="切换深色/浅色模式">🌙</button>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="app"></main>

<footer class="foot">
  <button id="resetBtn" class="foot-btn">重置全部数据</button>
  <span class="foot-note">数据保存在本机浏览器 · 可在「学习记录 → 数据备份」导出/导入</span>
</footer>

<script src="vendor/katex/katex.min.js"></script>
<script src="js/katex-fallback.js"></script>
<script src="js/math-renderer.js"></script>
<script src="js/core.js"></script>
<script src="js/qb-limit.js"></script>
<script src="js/qb-derivative.js"></script>
<script src="js/qb-app.js"></script>
<script src="js/qb-integral.js"></script>
<script src="js/qb-extra.js"></script>
<script src="js/qb-more.js"></script>
<script src="js/qb-more2.js"></script>
<script src="js/qb-solve.js"></script>
<script src="js/qb-sem2.js"></script>
<script src="js/qb-gaokao.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/store.js"></script>
<script src="js/backup.js"></script>
<script src="js/share.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.__initApp) window.__initApp();
});
window.addEventListener('load', function () {
  if (window.__rerenderAll) window.__rerenderAll();
  // 离线缓存：首次访问后，断网也能打开并正常显示公式
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () { });
  }
});
</script>
</body>
</html>
